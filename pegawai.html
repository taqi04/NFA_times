<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Data Pegawai</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin: 40px auto;
            background: white;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: #2c7be5;
            color: white;
        }

        tfoot {
            background-color: #dfe6e9;
            font-weight: bold;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Data Gaji Pegawai</h2>

    <table>
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
            </tr>
        </thead>

        <tbody id="dataPegawai">
        </tbody>

        <tfoot id="totalGaji">
        </tfoot>
    </table>

    <script>

        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "manajer";
        let status = "menikah";

        let gapok;

        if (jabatan == "manajer") {
            gapok = 15000000;
        } else if (jabatan == "asisten manajer") {
            gapok = 10000000;
        } else {
            gapok = 5000000;
        }



        // Tunjangan Jabatan 15%
        let tunjanganJabatan = 0.15 * gapok;

        // BPJS 10%
        let bpjs = 0.10 * gapok;

        // Tunjangan Keluarga (TERNARY)
        let tunjanganKeluarga =
            (status == "menikah") ? 0.20 * gapok : 0;


        let totalGaji =
            gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;



        document.getElementById("dataPegawai").innerHTML = `
<tr>
    <td>${nama}</td>
    <td>${umur}</td>
    <td>${jabatan}</td>
    <td>${status}</td>
    <td>Rp ${gapok.toLocaleString()}</td>
    <td>Rp ${tunjanganJabatan.toLocaleString()}</td>
    <td>Rp ${bpjs.toLocaleString()}</td>
    <td>Rp ${tunjanganKeluarga.toLocaleString()}</td>
</tr>
`;

        document.getElementById("totalGaji").innerHTML = `
<tr>
    <td colspan="7">Total Gaji</td>
    <td>Rp ${totalGaji.toLocaleString()}</td>
</tr>
`;
    </script>

</body>

</html>
