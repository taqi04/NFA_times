<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Sistem Manajemen Produk</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f6f8;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        button {
            padding: 6px 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .hapus {
            background: red;
            color: white;
        }

        .tambah {
            background: green;
            color: white;
        }

        form {
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>Sistem Manajemen Produk Toko</h2>

    <!-- FORM TAMBAH PRODUK -->
    <form onsubmit="event.preventDefault(); tambahProduk();">
        <input type="text" id="nama" placeholder="Nama Produk" required>
        <input type="number" id="harga" placeholder="Harga" required>
        <input type="number" id="stok" placeholder="Stok" required>
        <button class="tambah">Tambah Produk</button>
    </form>

    <!-- TABEL PRODUK -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>

        <tbody id="dataProduk">
        </tbody>

    </table>

    <script>

        /* =========================
           DATA PRODUK
        ========================= */
        let produkToko = [
            { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
            { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
            { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
        ];

        /* =========================
           TAMPILKAN PRODUK
        ========================= */
        function tampilkanProduk() {
            let tbody = document.getElementById("dataProduk");
            tbody.innerHTML = "";

            produkToko.forEach(produk => {
                tbody.innerHTML += `
        <tr>
            <td>${produk.id}</td>
            <td>${produk.nama}</td>
            <td>Rp ${produk.harga.toLocaleString()}</td>
            <td>${produk.stok}</td>
            <td>
                <button class="hapus"
                onclick="hapusProduk(${produk.id})">
                Hapus
                </button>
            </td>
        </tr>
        `;
            });
        }

        /* =========================
           TAMBAH PRODUK
        ========================= */
        function tambahProduk() {

            let nama = document.getElementById("nama").value;
            let harga = parseInt(document.getElementById("harga").value);
            let stok = parseInt(document.getElementById("stok").value);

            let idBaru = produkToko.length
                ? produkToko[produkToko.length - 1].id + 1
                : 1;

            produkToko.push({
                id: idBaru,
                nama: nama,
                harga: harga,
                stok: stok
            });

            tampilkanProduk();

            // reset form
            document.getElementById("nama").value = "";
            document.getElementById("harga").value = "";
            document.getElementById("stok").value = "";
        }

        /* =========================
           HAPUS PRODUK
        ========================= */
        function hapusProduk(id) {
            produkToko = produkToko.filter(p => p.id !== id);
            tampilkanProduk();
        }

        /* =========================
           LOAD AWAL
        ========================= */
        tampilkanProduk();

    </script>

</body>

</html>
